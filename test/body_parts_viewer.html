<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인간족 바디 & 리아나 의상·무기 모듈형 계층(FK) 뷰어</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --joint: #ef4444;
      --gold: #facc15;
      --green: #22c55e;
      --purple: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    aside {
      width: 480px;
      background: var(--card);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    h1 { font-size: 1.1rem; color: var(--accent); margin-bottom: 2px; }
    p.desc { font-size: 0.76rem; color: var(--muted); line-height: 1.35; }
    .badge {
      display: inline-block; padding: 2px 6px; border-radius: 4px;
      background: #0369a1; color: #fff; font-size: 0.7rem; font-weight: 700;
    }
    .badge.fk { background: #15803d; }
    .badge.costume { background: #7e22ce; }
    .panel-box {
      background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    }
    .panel-title {
      font-size: 0.82rem; font-weight: 700; margin-bottom: 8px; color: #e2e8f0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .anim-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;
    }
    .anim-btn {
      padding: 6px 4px; border: 1px solid var(--border); border-radius: 6px;
      background: #1e293b; color: var(--text); font-size: 0.75rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s; text-align: center;
    }
    .anim-btn:hover { background: #334155; }
    .anim-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 700; }

    /* 프리셋 탭 */
    .tab-bar {
      display: flex; gap: 4px; background: #1e293b; padding: 3px; border-radius: 6px; border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 6px 8px; border: none; border-radius: 4px; background: transparent;
      color: var(--muted); font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .tab-btn.active { background: #0284c7; color: #fff; }
    .tab-btn:hover:not(.active) { background: #334155; color: #fff; }

    .layer-list { display: flex; flex-direction: column; gap: 5px; }
    .layer-card {
      background: #1e293b; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .layer-top {
      display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem;
    }
    .layer-top label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 600; }
    .parent-tag {
      font-size: 0.65rem; color: #94a3b8; background: #0f172a; padding: 1px 5px; border-radius: 4px;
      font-weight: normal;
    }
    .controls-row {
      display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.72rem; color: var(--muted);
    }
    .controls-row input[type="range"] { flex: 1; }
    .coord-inputs {
      display: flex; gap: 3px; align-items: center;
    }
    .coord-inputs input[type="number"] {
      width: 44px; background: #0f172a; border: 1px solid var(--border); color: #fff;
      padding: 2px 2px; border-radius: 4px; font-size: 0.7rem; text-align: center;
    }
    .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
    button.action-btn {
      flex: 1; min-width: 75px; padding: 6px 8px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.75rem;
      cursor: pointer; background: var(--accent); color: #0f172a; transition: background 0.15s;
    }
    button.action-btn:hover { background: var(--accent-hover); }
    button.action-btn.secondary { background: #334155; color: #f1f5f9; }
    button.action-btn.secondary:hover { background: #475569; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle, #1e293b 0%, #090d16 100%);
    }
    .viewport {
      width: 680px;
      height: 680px;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background-size: 20px 20px;
      background-image: linear-gradient(to right, #1e293b 1px, transparent 1px),
                        linear-gradient(to bottom, #1e293b 1px, transparent 1px);
      overflow: hidden;
      cursor: crosshair;
    }
    .info-bar {
      margin-top: 8px; font-size: 0.76rem; color: var(--muted); display: flex; gap: 14px; align-items: center;
    }
    .cursor-coord {
      font-family: monospace; color: var(--accent); font-weight: 700;
    }
    .costume-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.75rem;
    }
    .costume-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #151f30; padding: 5px 8px; border-radius: 5px; border: 1px solid #23354d;
    }
    .costume-item label {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
    }
  </style>
</head>
<body>

<aside>
  <div>
    <h1>🧍‍♀️ 인간족 바디 & 리아나 모듈형 FK 뷰어</h1>
    <p class="desc">
      <span class="badge fk">FK 본 계층 연동</span>
      <span class="badge costume">리아나 의상 14종 분할</span>
      <span class="badge">모션 표정 연동</span><br>
      소체 바디의 관절 회전을 따라 의상·장검·방패·헤어가 함께 움직입니다.
    </p>
  </div>

  <!-- 프리셋 탭: 소체 바디 모드 vs 리아나 의상 모드 -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-liana" onclick="switchPresetMode('liana')">👗 리아나 의상·무기 착용</button>
    <button class="tab-btn" id="tab-body" onclick="switchPresetMode('body')">🦴 인간 소체 바디만 보기</button>
  </div>

  <!-- 실시간 모션 시뮬레이터 -->
  <div class="panel-box">
    <div class="panel-title">
      <span>🎬 실시간 모션 시뮬레이터</span>
      <span style="font-size: 0.68rem; color: #a5f3fc;">동적 표정 연동 ON</span>
    </div>
    <div class="anim-bar">
      <button class="anim-btn active" id="anim-none" onclick="setAnimMode('none')">⏹️ 수동 조작</button>
      <button class="anim-btn" id="anim-idle" onclick="setAnimMode('idle')">🌬️ 대기 (호흡·깜빡임)</button>
      <button class="anim-btn" id="anim-walk" onclick="setAnimMode('walk')">🏃 이동 (걷기)</button>
      <button class="anim-btn" id="anim-attack" onclick="setAnimMode('attack')">⚔️ 근접 공격 (기합)</button>
      <button class="anim-btn" id="anim-hit" onclick="setAnimMode('hit')">💥 피격 모션 (방어)</button>
      <button class="anim-btn" id="anim-explode" onclick="setAnimMode('explode')">🧩 파츠 전체 분해도</button>
    </div>
  </div>

  <!-- 리아나 전용 의상 및 표정 제어 패널 -->
  <div class="panel-box" id="liana-control-panel">
    <div class="panel-title">
      <span>👗 리아나 의상 / 무기 / 표정 제어</span>
      <div style="display: flex; gap: 4px;">
        <button class="action-btn secondary" style="padding: 2px 6px; font-size: 0.68rem;" onclick="toggleAllCostume(true)">전체 ON</button>
        <button class="action-btn secondary" style="padding: 2px 6px; font-size: 0.68rem;" onclick="toggleAllCostume(false)">전체 OFF</button>
      </div>
    </div>
    
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.76rem; background: #151f30; padding: 6px 8px; border-radius: 6px;">
      <span style="font-weight: 600; color: #38bdf8;">😀 표정 선택:</span>
      <select id="sel-face-mode" onchange="onFaceModeChange()" style="background: #0f172a; color: #fff; border: 1px solid var(--border); padding: 3px 6px; border-radius: 4px; font-size: 0.74rem;">
        <option value="auto">🔄 자동 (모션 연동 깜빡임/기합)</option>
        <option value="c03">c03. 기본 미소 (Neutral)</option>
        <option value="c04">c04. 눈 깜빡임 (Blink)</option>
        <option value="c05">c05. 공격 기합 (Attack)</option>
      </select>
    </div>

    <div class="costume-grid" id="costume-parts-grid">
      <!-- 동적 생성 -->
    </div>
  </div>

  <!-- 뷰어 표시 및 원본 겹쳐보기 옵션 -->
  <div class="panel-box">
    <div class="panel-title">
      <span>뷰어 오버레이 및 관절 보정 옵션</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.74rem;">
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
        <input type="checkbox" id="chk-show-pivots" checked onchange="render()">
        <span style="color: #f87171; font-weight: 600;">🔴 관절 축 & 뼈대선</span>
      </label>
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
        <input type="checkbox" id="chk-fk-mode" checked onchange="render()">
        <span style="color: #4ade80; font-weight: 600;">🔗 부모-자식 연동(FK)</span>
      </label>
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; grid-column: span 2;">
        <input type="checkbox" id="chk-limit-rot" checked onchange="toggleRotationLimits()">
        <span style="color: #38bdf8; font-weight: 600;">🔒 관절별 실제 가동범위 제한</span>
      </label>
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; grid-column: span 2;">
        <input type="checkbox" id="chk-joint-fix" checked onchange="render()">
        <span style="color: #facc15; font-weight: 600;">🩹 바디 관절 자동 연장 (회전 시 빈틈 메우기)</span>
      </label>
      
      <!-- c00 리아나 완성본 겹쳐보기 -->
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
        <input type="checkbox" id="chk-c00" onchange="render()">
        <span style="color: #e879f9; font-weight: 600;">c00 완성본 겹치기</span>
      </label>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="color: var(--muted); font-size: 0.7rem;">투명도:</span>
        <input type="range" id="op-c00" min="0" max="100" value="40" style="width: 65px;" oninput="render()">
      </div>

      <!-- b00 원본 겹쳐보기 -->
      <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
        <input type="checkbox" id="chk-b00" onchange="render()">
        <span>b00 바디 겹치기</span>
      </label>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="color: var(--muted); font-size: 0.7rem;">투명도:</span>
        <input type="range" id="op-b00" min="0" max="100" value="30" style="width: 65px;" oninput="render()">
      </div>
    </div>
  </div>

  <!-- 파츠별 관절 회전 제어 패널 (소체 바디) -->
  <div class="panel-box" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
    <div class="panel-title">
      <span>🦴 바디 관절 회전 제어 (FK 스켈레톤)</span>
      <span style="font-size: 0.68rem; color: var(--muted);">피벗 X, Y</span>
    </div>
    <div class="layer-list" id="parts-container" style="overflow-y: auto; padding-right: 4px;"></div>
  </div>

  <div class="btn-group">
    <button class="action-btn" onclick="resetRotations()">🔄 각도 초기화</button>
    <button class="action-btn secondary" onclick="toggleAllBody(true)">바디 켜기</button>
    <button class="action-btn secondary" onclick="toggleAllBody(false)">바디 끄기</button>
    <button class="action-btn secondary" onclick="autoFixPivots()">📐 피벗 자동보정</button>
    <button class="action-btn secondary" onclick="resetPivotsToDefault()">🎯 피벗 리셋</button>
    <button class="action-btn secondary" onclick="copyCurrentPivots()">📋 피벗 복사</button>
  </div>
  <div id="fix-status" style="font-size: 0.7rem; color: var(--muted); line-height: 1.35; white-space: pre-line;"></div>
</aside>

<main>
  <div class="viewport" id="viewport" onmousemove="updateCursorCoord(event)">
    <canvas id="view-canvas" width="1024" height="1024" style="width: 100%; height: 100%;"></canvas>
  </div>
  <div class="info-bar">
    <span>마우스: <span class="cursor-coord" id="cursor-pos">X: -, Y: -</span></span>
    <span>Near = 화면 왼쪽(캐릭터 우측 검) / Far = 화면 오른쪽(캐릭터 좌측 방패)</span>
  </div>
</main>

<script>
/**
 * 정밀 피벗 좌표 기본값 (바디 소체 기준)
 */
const DEFAULT_PIVOTS = {
  b06: [582, 460], // 먼 팔 위 (어깨)
  b07: [612, 565], // 먼 팔 아래 (팔꿈치)
  b09: [566, 680], // 먼 다리 (고관절)
  b08: [481, 680], // 가까운 다리 (고관절)
  b03: [520, 650], // 골반 (Root)
  b02: [520, 620], // 상체 (허리)
  b01: [513, 395], // 머리 (목)
  b04: [446, 458], // 가까운 팔 위 (어깨)
  b05: [415, 565]  // 가까운 팔 아래 (팔꿈치)
};

/**
 * 바디 파츠 설정 (9종)
 */
const BODY_PARTS_CONFIG = [
  { id: "b06", parent: "b02", file: "b06_arm_far_upper.png",  name: "b06. 먼 팔 위",     parentLabel: "상체(어깨)",   pivot: [...DEFAULT_PIVOTS.b06], minRot: -40, maxRot: 35, rot: 0, color: "#f43f5e", explodeOffset: [70, -30] },
  { id: "b07", parent: "b06", file: "b07_arm_far_lower.png",  name: "b07. 먼 팔 아래",   parentLabel: "b06(팔꿈치)", pivot: [...DEFAULT_PIVOTS.b07], minRot: -45, maxRot: 20, rot: 0, color: "#fb7185", explodeOffset: [110, 30] },
  { id: "b09", parent: "b03", file: "b09_leg_far.png",        name: "b09. 먼 다리",      parentLabel: "골반(고관절)", pivot: [...DEFAULT_PIVOTS.b09], minRot: -25, maxRot: 25, rot: 0, color: "#a855f7", explodeOffset: [55, 80] },
  { id: "b08", parent: "b03", file: "b08_leg_near.png",       name: "b08. 가까운 다리",  parentLabel: "골반(고관절)", pivot: [...DEFAULT_PIVOTS.b08], minRot: -25, maxRot: 25, rot: 0, color: "#c084fc", explodeOffset: [-55, 80] },
  { id: "b03", parent: null,  file: "b03_pelvis.png",         name: "b03. 골반 (Root)",  parentLabel: "최상위 루트",  pivot: [...DEFAULT_PIVOTS.b03], minRot: -8,  maxRot: 8,  rot: 0, color: "#eab308", explodeOffset: [0, 20] },
  { id: "b02", parent: "b03", file: "b02_torso_upper.png",    name: "b02. 상체",         parentLabel: "골반(허리)",   pivot: [...DEFAULT_PIVOTS.b02], minRot: -10, maxRot: 10, rot: 0, color: "#38bdf8", explodeOffset: [0, -25] },
  { id: "b01", parent: "b02", file: "b01_head_base.png",      name: "b01. 머리 소체",    parentLabel: "상체(목)",     pivot: [...DEFAULT_PIVOTS.b01], minRot: -15, maxRot: 15, rot: 0, color: "#22c55e", explodeOffset: [0, -95] },
  { id: "b04", parent: "b02", file: "b04_arm_near_upper.png", name: "b04. 가까운 팔 위", parentLabel: "상체(어깨)",   pivot: [...DEFAULT_PIVOTS.b04], minRot: -40, maxRot: 35, rot: 0, color: "#f97316", explodeOffset: [-70, -30] },
  { id: "b05", parent: "b04", file: "b05_arm_near_lower.png", name: "b05. 가까운 팔 아래",parentLabel: "b04(팔꿈치)", pivot: [...DEFAULT_PIVOTS.b05], minRot: -45, maxRot: 20, rot: 0, color: "#fb923c", explodeOffset: [-110, 30] }
];

/**
 * 리아나 의상 및 무기 파츠 (14종)
 * 바디의 특정 부모 노드에 종속되어 움직임
 */
const LIANA_COSTUME_CONFIG = [
  { id: "c01", parent: "b01", file: "c01_hair_back.png",    name: "c01. 뒷머리",       category: "헤어",   explodeOffset: [0, -145] },
  { id: "c02", parent: "b01", file: "c02_hair_front.png",   name: "c02. 앞·옆머리",    category: "헤어",   explodeOffset: [0, -70] },
  { id: "c06", parent: "b02", file: "c06_top.png",          name: "c06. 상의 흉갑",    category: "의상",   explodeOffset: [-35, -25] },
  { id: "c07", parent: "b03", file: "c07_skirt_front.png",  name: "c07. 앞자락·벨트", category: "의상",   explodeOffset: [-25, 20] },
  { id: "c08", parent: "b03", file: "c08_skirt_back.png",   name: "c08. 튜닉 뒷자락", category: "의상",   explodeOffset: [25, 20] },
  { id: "c09", parent: "b04", file: "c09_sleeve_near.png",  name: "c09. 가까운 소매",  category: "의상",   explodeOffset: [-70, -60] },
  { id: "c10", parent: "b06", file: "c10_sleeve_far.png",   name: "c10. 먼 소매",      category: "의상",   explodeOffset: [70, -60] },
  { id: "c11", parent: "b08", file: "c11_pants_near.png",   name: "c11. 앞 바지·부츠", category: "의상",   explodeOffset: [-85, 80] },
  { id: "c12", parent: "b09", file: "c12_pants_far.png",    name: "c12. 뒤 바지·부츠", category: "의상",   explodeOffset: [85, 80] },
  { id: "c13", parent: "b05", file: "c13_weapon_main.png",  name: "c13. 강철 장검",   category: "무기",   explodeOffset: [-175, 45] },
  { id: "c14", parent: "b07", file: "c14_weapon_sub.png",   name: "c14. 나무 방패",   category: "무기",   explodeOffset: [165, 30] }
];

// 표정 파츠 3종
const LIANA_FACES = {
  c03: { id: "c03", file: "c03_face_neutral.png", name: "기본 미소" },
  c04: { id: "c04", file: "c04_face_blink.png",   name: "눈 깜빡임" },
  c05: { id: "c05", file: "c05_face_attack.png",  name: "공격 기합" }
};

/**
 * 21개 복합 레이어 렌더링 순서 (사양서 6절 및 조립 합성 검증 기준: 아래 -> 위)
 */
const RENDER_PIPELINE = [
  { kind: "costume", id: "c01" }, // 1. 뒷머리
  { kind: "body",    id: "b06" }, // 2. 먼 팔 위
  { kind: "costume", id: "c10" }, // 3. 먼 소매
  { kind: "body",    id: "b07" }, // 4. 먼 팔 아래
  { kind: "costume", id: "c14" }, // 5. 방패
  { kind: "costume", id: "c08" }, // 6. 튜닉 뒷자락
  { kind: "body",    id: "b09" }, // 7. 먼 다리
  { kind: "costume", id: "c12" }, // 8. 먼 바지·부츠

function loadChromaImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const off = document.createElement("canvas");
      off.width = img.width;
      off.height = img.height;
      const ctx = off.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const idata = ctx.getImageData(0, 0, off.width, off.height);
      const d = idata.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        if (g > 150 && r < 120 && b < 120) {
          d[i+3] = 0;
        }
      }
      ctx.putImageData(idata, 0, 0);
      resolve(off);
    };
    img.onerror = () => {
      console.warn("Failed to load image:", url);
      resolve(null);
    };
    img.src = url;
  });
}

/* ==========================================================================
 * 관절 자동 보정 및 피부 캡 연장 로직 (소체 바디)
 * ========================================================================== */
const maskCache = {};
function getMask(id) {
  if (maskCache[id]) return maskCache[id];
  const c = loadedImages[id];
  if (!c) return { a: new Uint8Array(0), w: 0, h: 0, centroid: [0, 0] };
  const d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data;
  const w = c.width, h = c.height, a = new Uint8Array(w * h);
  let sx = 0, sy = 0, n = 0;
  for (let i = 0; i < a.length; i++) {
    if (d[i * 4 + 3] > 0) { a[i] = 1; sx += i % w; sy += (i / w) | 0; n++; }
  }
  maskCache[id] = { a, w, h, centroid: n ? [sx / n, sy / n] : [w / 2, h / 2] };
  return maskCache[id];
}

function isOpaque(m, x, y) {
  x = Math.round(x); y = Math.round(y);
  return x >= 0 && y >= 0 && x < m.w && y < m.h && m.a[y * m.w + x] === 1;
}

function measureJoint(parent, child) {
  const J = child.pivot;
  const B = getMask(child.id);
  let dx = B.centroid[0] - J[0], dy = B.centroid[1] - J[1];
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  const nx = -dy, ny = dx;

  const filled = (t) => {
    for (const s of [2, 4, 6, 8, 10]) {
      const x = J[0] + nx * t + dx * s, y = J[1] + ny * t + dy * s;
      if (isOpaque(B, x, y)) return true;
    }
    return false;
  };
  const reach = (sign) => {
    let last = 0, miss = 0;
    for (let t = 1; t <= 240; t++) {
      if (filled(sign * t)) { last = t; miss = 0; } else if (++miss > 3) break;
    }
    return last;
  };
  const tPos = reach(1), tNeg = reach(-1);
  return {
    dir: [dx, dy],
    width: tPos + tNeg,
    mid: [J[0] + nx * (tPos - tNeg) / 2, J[1] + ny * (tPos - tNeg) / 2]
  };
}

function isValidSkin(r, g, b, a) {
  if (a < 180) return false;
  if (g > 130 && r < 120 && b < 120) return false;
  if (g > r && g > b) return false;
  if (g > r * 0.95 && g > b + 20) return false;
  const lum = r * 0.299 + g * 0.587 + b * 0.114;
  if (lum < 145) return false;
  if (r < 165 || g < 125 || b < 95) return false;
  if (r < g || g < b * 0.78) return false;
  return true;
}

function extendAtJoint(imgData, src, part, neighbor, J, radius) {
  const W = imgData.width, H = imgData.height;
  const mp = getMask(part.id), mn = getMask(neighbor.id);
  const x0 = Math.max(0, Math.floor(J[0] - radius - 4)), x1 = Math.min(W - 1, Math.ceil(J[0] + radius + 4));
  const y0 = Math.max(0, Math.floor(J[1] - radius - 4)), y1 = Math.min(H - 1, Math.ceil(J[1] + radius + 4));
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const owner = new Int32Array(bw * bh).fill(-1);
  const r2 = radius * radius;

  let sumR = 0, sumG = 0, sumB = 0, skinCount = 0;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (isOpaque(mp, x, y)) {
        const idx = (y * W + x) * 4;
        const r = src[idx], g = src[idx + 1], b = src[idx + 2], a = src[idx + 3];
        if (isValidSkin(r, g, b, a)) {
          sumR += r; sumG += g; sumB += b; skinCount++;
        }
      }
    }
  }

  let fallbackR = 248, fallbackG = 212, fallbackB = 192;
  if (skinCount > 0) {
    fallbackR = Math.round(sumR / skinCount);
    fallbackG = Math.round(sumG / skinCount);
    fallbackB = Math.round(sumB / skinCount);
  }

  const isTarget = (x, y) => {
    const ddx = x - J[0], ddy = y - J[1];
    return ddx * ddx + ddy * ddy <= r2 && !isOpaque(mp, x, y) && isOpaque(mn, x, y);
  };

  const queue = new Int32Array(bw * bh);
  let head = 0, tail = 0;

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (isOpaque(mp, x, y)) {
        const idx = (y * W + x) * 4;
        const r = src[idx], g = src[idx + 1], b = src[idx + 2], a = src[idx + 3];
        if (isValidSkin(r, g, b, a)) {
          const k = (y - y0) * bw + (x - x0);
          owner[k] = y * W + x;
          queue[tail++] = k;
        }
      }
    }
  }

  if (tail === 0) {
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (isTarget(x, y)) {
          const t = (y * W + x) * 4;
          imgData.data[t] = fallbackR;
          imgData.data[t + 1] = fallbackG;
          imgData.data[t + 2] = fallbackB;
          imgData.data[t + 3] = 255;
        }
      }
    }
    return;
  }

  while (head < tail) {
    const k = queue[head++];
    const kx = k % bw, ky = (k / bw) | 0;
    for (const [ox, oy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const qx = kx + ox, qy = ky + oy;
      if (qx < 0 || qy < 0 || qx >= bw || qy >= bh) continue;
      const q = qy * bw + qx;
      if (owner[q] !== -1) continue;
      const gx = qx + x0, gy = qy + y0;
      if (!isTarget(gx, gy)) continue;
      owner[q] = owner[k];
      queue[tail++] = q;
      const s = owner[k] * 4, t = (gy * W + gx) * 4;
      imgData.data[t] = src[s];
      imgData.data[t + 1] = src[s + 1];
      imgData.data[t + 2] = src[s + 2];
      imgData.data[t + 3] = 255;
    }
  }

  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const q = (y - y0) * bw + (x - x0);
      if (owner[q] === -1 && isTarget(x, y)) {
        const t = (y * W + x) * 4;
        imgData.data[t] = fallbackR;
        imgData.data[t + 1] = fallbackG;
        imgData.data[t + 2] = fallbackB;
        imgData.data[t + 3] = 255;
      }
    }
  }
}

function rebuildJointCaps() {
  const work = {};
  for (const p of BODY_PARTS_CONFIG) {
    const img = loadedImages[p.id];
    if (!img) return;
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, c.width, c.height);
    work[p.id] = { c, ctx, data, src: new Uint8ClampedArray(data.data) };
  }

  const MAX_RADIUS = {
    b01: 30, b04: 32, b05: 28, b06: 30, b07: 28, b08: 42, b09: 42, b02: 46
  };

  for (const child of BODY_PARTS_CONFIG) {
    if (!child.parent) continue;
    const parent = partMap[child.parent];
    const m = measureJoint(parent, child);
    const rawR = (m.width / 2) * 1.1;
    const maxR = MAX_RADIUS[child.id] || 30;
    const radius = Math.min(maxR, Math.max(12, rawR));
    if (m.width < 6) continue;

    const childIdx = BODY_PARTS_CONFIG.findIndex(p => p.id === child.id);
    const parentIdx = BODY_PARTS_CONFIG.findIndex(p => p.id === parent.id);

    if (childIdx < parentIdx) {
      extendAtJoint(work[child.id].data, work[child.id].src, child, parent, child.pivot, radius);
    } else {
      extendAtJoint(work[parent.id].data, work[parent.id].src, parent, child, child.pivot, radius);
    }
  }
  for (const p of BODY_PARTS_CONFIG) {
    work[p.id].ctx.putImageData(work[p.id].data, 0, 0);
    capImages[p.id] = work[p.id].c;
  }
}

function autoFixPivots() {
  const lines = [];
  for (const child of BODY_PARTS_CONFIG) {
    if (!child.parent) continue;
    const m = measureJoint(partMap[child.parent], child);
    if (m.width < 6) { lines.push(`${child.id}: 관절 단면을 찾지 못해 유지`); continue; }
    
    const def = DEFAULT_PIVOTS[child.id] || child.pivot;
    const next = [Math.round(m.mid[0]), Math.round(m.mid[1])];
    const shiftFromDef = Math.hypot(next[0] - def[0], next[1] - def[1]);
    
    if (shiftFromDef > 8) {
      lines.push(`${child.id}: 측정치(${next})가 관절 중심에서 벗어나 기본값 [${def}] 유지`);
      child.pivot = [...def];
    } else {
      const moved = Math.hypot(next[0] - child.pivot[0], next[1] - child.pivot[1]);
      if (moved >= 1) {
        lines.push(`${child.id}: [${child.pivot}] → [${next}] (${moved.toFixed(1)}px 보정)`);
        child.pivot = next;
      }
    }
    const xEl = document.getElementById(`pivX-${child.id}`), yEl = document.getElementById(`pivY-${child.id}`);
    if (xEl) xEl.value = child.pivot[0];
    if (yEl) yEl.value = child.pivot[1];
  }
  rebuildJointCaps();
  render();
  const status = document.getElementById("fix-status");
  if (status) status.textContent = lines.length ? `피벗 보정 결과:\n${lines.join("\n")}` : "피벗: 모든 관절이 최적 위치입니다.";
}

/* ==========================================================================
 * 애니메이션 모션 시뮬레이터 (표정 자동 연동)
 * ========================================================================== */
function setAnimMode(mode) {
  animMode = mode;
  document.querySelectorAll('.anim-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`anim-${mode}`)?.classList.add('active');

  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }

  rootOffsetY = 0;
  if (mode === 'none' || mode === 'explode') {
    resetRotations();
    if (faceMode === "auto") activeFaceKey = "c03";
    render();
    return;
  }

  const startTime = performance.now();
  function tick(now) {
    if (animMode !== mode) return;
    const t = (now - startTime) / 1000;

    BODY_PARTS_CONFIG.forEach(p => { p.sy = 1; });

    if (mode === 'idle') {
      // 대기 모션: 호흡 + 눈 깜빡임 연동
      rootOffsetY = Math.sin(t * 2.5) * 3;
      partMap.b03.rot = 0;
      partMap.b02.rot = Math.sin(t * 2.5) * 1;
      partMap.b02.sy = 1 + Math.sin(t * 2.5) * 0.015;
      partMap.b01.rot = Math.sin(t * 2.5 - 0.5) * 4;
      partMap.b04.rot = Math.sin(t * 2.5) * 5;
      partMap.b05.rot = Math.sin(t * 2.5 - 0.4) * 6 - 5;
      partMap.b06.rot = -Math.sin(t * 2.5) * 5;
      partMap.b07.rot = -Math.sin(t * 2.5 - 0.4) * 6 - 5;
      partMap.b08.rot = 0;
      partMap.b09.rot = 0;

      // 표정: 3.5초 주기 중 0.16초 눈 깜빡임
      if (faceMode === "auto") {
        const cycle = t % 3.5;
        activeFaceKey = (cycle < 0.16) ? "c04" : "c03";
      }

    } else if (mode === 'walk') {
      // 걷기 모션
      const w = t * 6.5;
      rootOffsetY = Math.abs(Math.sin(w)) * -10;
      partMap.b03.rot = Math.sin(w) * 3;
      partMap.b02.rot = 4 + Math.sin(w * 2) * 2;
      partMap.b01.rot = -2 + Math.sin(w * 2) * 3;
      partMap.b08.rot = Math.sin(w) * 24;
      partMap.b09.rot = -Math.sin(w) * 24;
      partMap.b04.rot = -Math.sin(w) * 22;
      partMap.b05.rot = -15 - Math.max(0, Math.sin(w)) * 18;
      partMap.b06.rot = Math.sin(w) * 22;
      partMap.b07.rot = -15 - Math.max(0, -Math.sin(w)) * 18;

      if (faceMode === "auto") {
        const cycle = t % 4.0;
        activeFaceKey = (cycle < 0.15) ? "c04" : "c03";
      }

    } else if (mode === 'attack') {
      // 근접 공격 모션: 기합 표정 연동
      const cycle = (t * 1.3) % 1.0;
      let swing = 0;
      if (cycle < 0.35) {
        swing = -(cycle / 0.35);
      } else if (cycle < 0.58) {
        const p = (cycle - 0.35) / 0.23;
        swing = -1 + p * 2.2;
      } else {
        const p = (cycle - 0.58) / 0.42;
        swing = 1.2 * (1 - p);
      }
      rootOffsetY = swing > 0 ? swing * 6 : 0;
      partMap.b03.rot = swing * 5;
      partMap.b02.rot = swing * 12;
      partMap.b01.rot = -swing * 6;
      partMap.b04.rot = swing < 0 ? swing * 35 : swing * 30;
      partMap.b05.rot = swing < 0 ? swing * 30 : -10 + swing * 18;
      partMap.b06.rot = -swing * 18;
      partMap.b07.rot = -20;
      partMap.b08.rot = -swing * 10;
      partMap.b09.rot = swing * 12;

      // 표정: 공격 스윙 중(0.30~0.65) 강력한 기합 표정 c05
      if (faceMode === "auto") {
        activeFaceKey = (cycle >= 0.30 && cycle <= 0.65) ? "c05" : "c03";
      }

    } else if (mode === 'hit') {
      // 피격 모션
      const cycle = (t * 1.8) % 1.0;
      const impact = cycle < 0.2 ? (cycle / 0.2) : Math.max(0, 1 - (cycle - 0.2) / 0.8);
      rootOffsetY = impact * 5;
      partMap.b03.rot = -impact * 7;
      partMap.b02.rot = -impact * 10;
      partMap.b01.rot = -impact * 10;
      partMap.b04.rot = -impact * 28;
      partMap.b05.rot = -impact * 35;
      partMap.b06.rot = impact * 25;
      partMap.b07.rot = -impact * 40;
      partMap.b08.rot = impact * 12;
      partMap.b09.rot = -impact * 8;

      if (faceMode === "auto") {
        activeFaceKey = (impact > 0.3) ? "c05" : "c03";
      }
    }

    applyRotationLimits();
    syncSlidersFromState();
    render();
    animFrameId = requestAnimationFrame(tick);
  }
  animFrameId = requestAnimationFrame(tick);
}

function onRotate(id, val) {
  if (animMode !== 'none' && animMode !== 'explode') setAnimMode('none');
  const p = partMap[id];
  if (p) p.rot = parseFloat(val);
  const valEl = document.getElementById(`rot-val-${id}`);
  if (valEl) valEl.textContent = `${Math.round(val)}°`;
  render();
}

function onPivotChange(id) {
  const p = partMap[id];
  if (!p) return;
  const px = parseInt(document.getElementById(`pivX-${id}`).value, 10) || p.pivot[0];
  const py = parseInt(document.getElementById(`pivY-${id}`).value, 10) || p.pivot[1];
  p.pivot = [px, py];
  rebuildJointCaps();
  render();
}

function resetRotations() {
  for (const p of BODY_PARTS_CONFIG) {
    p.rot = 0;
    p.sy = 1;
  }
  syncSlidersFromState();
  render();
}

function updateCursorCoord(e) {
  const rect = document.getElementById("viewport").getBoundingClientRect();
  const scale = 1024 / rect.width;
  const x = Math.round((e.clientX - rect.left) * scale);
  const y = Math.round((e.clientY - rect.top) * scale);
  document.getElementById("cursor-pos").textContent = `X: ${x}, Y: ${y}`;
}

/* ==========================================================================
 * 계층형(FK) 본 체인 변환 엔진
 * ========================================================================== */
function getBoneChain(partOrCostume) {
  const useFK = document.getElementById("chk-fk-mode")?.checked ?? true;
  if (!useFK) {
    // FK 끔일 경우: 본인(또는 직속 부모 바디)의 자체 회전만
    const curBody = partOrCostume.parent ? partMap[partOrCostume.parent] : partOrCostume;
    return curBody ? [curBody] : [];
  }
  const chain = [];
  let cur = partOrCostume;
  while (cur) {
    if (cur.parent) {
      const pNode = partMap[cur.parent];
      if (pNode) chain.unshift(pNode);
      cur = pNode;
    } else {
      break;
    }
  }
  // 만약 본인이 바디 파츠라면 자기 자신도 체인 끝에 포함
  if (partMap[partOrCostume.id] && !chain.includes(partOrCostume)) {
    chain.push(partOrCostume);
  }
  return chain;
}

function applyChainTransform(ctx, item) {
  if (animMode === 'explode') {
    const [ox, oy] = item.explodeOffset || [0, 0];
    ctx.translate(ox, oy);
  } else if (rootOffsetY !== 0) {
    ctx.translate(0, rootOffsetY);
  }

  const chain = getBoneChain(item);
  for (const node of chain) {
    if (node.rot !== 0 || node.sy !== 1) {
      const [px, py] = node.pivot;
      ctx.translate(px, py);
      ctx.rotate((node.rot * Math.PI) / 180);
      ctx.scale(1, node.sy);
      ctx.translate(-px, -py);
    }
  }
}

function getTransformedPoint(part, x, y) {
  let ptX = x, ptY = y;
  const useFK = document.getElementById("chk-fk-mode")?.checked ?? true;
  const chain = useFK ? getBoneChain(part) : [part];
  for (let i = chain.length - 1; i >= 0; i--) {
    const node = chain[i];
    if (node.rot !== 0 || node.sy !== 1) {
      const [px, py] = node.pivot;
      const rad = (node.rot * Math.PI) / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      const dx = ptX - px, dy = (ptY - py) * node.sy;
      ptX = px + dx * cos - dy * sin;
      ptY = py + dx * sin + dy * cos;
    }
  }
  if (animMode === 'explode') {
    const [ox, oy] = part.explodeOffset || [0, 0];
    ptX += ox;
    ptY += oy;
  } else {
    ptY += rootOffsetY;
  }
  return [ptX, ptY];
}

/* ==========================================================================
 * 메인 렌더 함수 (21개 복합 레이어 파이프라인 조립)
 * ========================================================================== */
function render() {
  const canvas = document.getElementById("view-canvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, 1024, 1024);

  // 1. b00 소체 원본 겹쳐보기
  const showB00 = document.getElementById("chk-b00")?.checked;
  if (showB00 && b00Image) {
    const alpha = parseFloat(document.getElementById("op-b00").value) / 100;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(b00Image, 0, 0);
    ctx.restore();
  }

  // 2. c00 리아나 완성본 겹쳐보기
  const showC00 = document.getElementById("chk-c00")?.checked;
  if (showC00 && c00Image) {
    const alpha = parseFloat(document.getElementById("op-c00").value) / 100;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(c00Image, 0, 0);
    ctx.restore();
  }

  // 3. 21개 복합 파츠 레이어 순차 렌더링 (사양서 6절 아래 -> 위 순서)
  const isJointFix = (animMode !== 'explode') && (document.getElementById("chk-joint-fix")?.checked ?? true);

  for (const step of RENDER_PIPELINE) {
    if (step.kind === "body") {
      const p = partMap[step.id];
      const isVisible = document.getElementById(`chk-${p.id}`)?.checked;
      const img = (isJointFix && capImages[p.id]) ? capImages[p.id] : loadedImages[p.id];
      if (isVisible && img) {
        ctx.save();
        applyChainTransform(ctx, p);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
      }
    } else if (step.kind === "costume") {
      const c = costumeMap[step.id];
      const isVisible = document.getElementById(`chk-${c.id}`)?.checked;
      const img = loadedImages[c.id];
      if (isVisible && img) {
        ctx.save();
        applyChainTransform(ctx, c);
        ctx.drawImage(img, 0, 0);
        ctx.restore();
      }
    } else if (step.kind === "face") {
      // 표정 렌더링 (현재 활성화된 activeFaceKey)
      const headVisible = document.getElementById("chk-b01")?.checked;
      const fImg = loadedImages[activeFaceKey];
      if (headVisible && fImg) {
        const fakeFacePart = { id: "face", parent: "b01", explodeOffset: [0, -95] };
        ctx.save();
        applyChainTransform(ctx, fakeFacePart);
        ctx.drawImage(fImg, 0, 0);
        ctx.restore();
      }
    }
  }

  // 4. 관절 피벗 마커 & 뼈대 연결선(Bone Lines) 오버레이
  const showPivots = document.getElementById("chk-show-pivots")?.checked;
  if (showPivots) {
    ctx.save();
    const worldPivots = {};
    for (const p of BODY_PARTS_CONFIG) {
      worldPivots[p.id] = getTransformedPoint(p, p.pivot[0], p.pivot[1]);
    }

    // 부모-자식 뼈대 연결선
    ctx.lineWidth = 2;
    ctx.strokeStyle = "rgba(74, 222, 128, 0.7)";
    for (const p of BODY_PARTS_CONFIG) {
      const isVisible = document.getElementById(`chk-${p.id}`)?.checked;
      if (!isVisible || !p.parent) continue;
      const [x1, y1] = worldPivots[p.parent];
      const [x2, y2] = worldPivots[p.id];
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    // 각 관절 피벗 마커와 라벨
    for (const p of BODY_PARTS_CONFIG) {
      const isVisible = document.getElementById(`chk-${p.id}`)?.checked;
      if (!isVisible) continue;
      const [wx, wy] = worldPivots[p.id];

      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(wx - 8, wy); ctx.lineTo(wx + 8, wy);
      ctx.moveTo(wx, wy - 8); ctx.lineTo(wx, wy + 8);
      ctx.stroke();

      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(wx, wy, 4.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 11px monospace";
      ctx.fillText(p.id, wx + 7, wy - 5);
    }
    ctx.restore();
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
</body>
