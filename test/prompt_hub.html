function renderGrid(containerId, items) {
  const container = document.getElementById(containerId);
  container.innerHTML = items.map(item => `
    <div class="card">
      <div>
        <div class="card-header">
          <span class="card-title">${item.name}</span>
          <span class="card-code">${item.file}</span>
        </div>
        <div class="prompt-box" id="prompt-${item.id}">${item.prompt}</div>
      </div>
      <button class="btn" onclick="copyPrompt('${item.id}', this)">📋 프롬프트 복사</button>
    </div>
  `).join('');
}

function copyPrompt(id, btn) {
  const text = document.getElementById(`prompt-${id}`).textContent;
  navigator.clipboard.writeText(text).then(() => {
    const origText = btn.textContent;
    btn.textContent = "✅ 복사 완료!";
    btn.classList.add("copied");
    showToast();
    setTimeout(() => {
      btn.textContent = origText;
      btn.classList.remove("copied");
    }, 1500);
  });
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 1500);
}
