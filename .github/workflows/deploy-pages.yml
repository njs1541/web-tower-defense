# GitHub Pages 배포 (v0.53.3 작성, v0.54.0 수동 전용으로 변경, 워크플로 P2-1)
#
# ⚠️ 공개 배포는 사용자가 확정하기 전까지 하지 않는다 (사용자 결정, 2026-11-09).
#    v1.0에 도달해도 사용자의 명시적 확정 없이는 실행하지 않는다.
#    - 푸시로는 실행되지 않는다. GitHub Actions 화면에서 수동 실행(workflow_dispatch)만 가능하다.
#    - 수동 실행 시 confirm 입력란에 정확히 "배포 확정"을 넣어야 진행되고, 그 외에는 첫 단계에서 실패한다.
#    - 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꾸는 것도 사용자가 확정한 뒤에 한다.
#
# 실행되면 게임 실행에 필요한 파일만 모아 Pages로 배포한다.
#
# 포함: index.html, style.css, js/, assets/ (게임이 쓰지 않는 참고 이미지는 제외)
# 제외: 에셋 도구 HTML, 스타일 가이드, 기획/QA 문서, test/, scratch/, docs/
# index.html의 "<!-- dev-only:start" ~ "<!-- dev-only:end -->" 구간(에셋 스튜디오 링크 등)은 배포본에서 삭제한다.
name: Deploy game to GitHub Pages

on:
  # push 트리거 없음: 커밋/푸시해도 배포되지 않는다
  workflow_dispatch:
    inputs:
      confirm:
        description: '공개 배포를 사용자가 확정했다면 정확히 "배포 확정"을 입력'
        required: true
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require explicit deploy confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "배포 확정" ]; then
            echo "공개 배포가 확정되지 않았습니다. 배포를 중단합니다."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Collect game files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css _site/
          cp -r js _site/js
          cp -r assets _site/assets
          # 게임이 참조하지 않는 참고 자료 (실바나는 게임에서 제외됨, 스타일·시트 템플릿은 에셋 제작용)
          rm -f _site/assets/style_*.jpg _site/assets/*template*.png
          rm -f _site/assets/*sylvana* _site/assets/parts/sylvana_*
          rm -f _site/assets/ref_ranger_sheet_*.jpg
          # 개발용 UI 구간 삭제
          sed -i '/<!-- dev-only:start/,/<!-- dev-only:end -->/d' _site/index.html
          if grep -q 'dev-only' _site/index.html; then echo "dev-only 구간 삭제 실패"; exit 1; fi
          touch _site/.nojekyll
          echo "배포 파일 크기:"; du -sh _site; du -sh _site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
