<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Live2D 파츠 리깅 및 앵커/피벗 보정 테스트베드</title>
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      gap: 24px;
      padding: 24px;
      margin: 0;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .canvas-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    canvas {
      background: #151c2c;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .hint {
      font-size: 12px;
      color: #64748b;
    }
    .controls {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    .controls h3 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }
    input[type=range] {
      width: 100%;
      cursor: pointer;
      accent-color: #38bdf8;
    }
    select {
      width: 100%;
      padding: 8px 12px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    select:focus {
      border-color: #38bdf8;
    }
    .badge {
      color: #38bdf8;
      font-weight: bold;
    }
    .val-text {
      color: #a855f7;
      font-weight: 600;
    }
    .btn-primary {
      padding: 10px 14px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0b0f19;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: filter 0.2s;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
    }
    .status-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #34d399;
      border: 1px solid #10b981;
      display: none;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <canvas id="viewCanvas" width="600" height="600"></canvas>
    <div class="hint">💡 <b>가이드 범례</b>: 노란 다이아몬드 = 결합 앵커(Anchor) / 빨간 원 + 십자선 = 파츠 회전 중심점(Pivot)</div>
  </div>

  <div class="controls">
    <h3>⚙️ 파츠 관절 & 앵커 보정</h3>
    
    <div class="form-group">
      <label>선택 파츠: <span id="lblPart" class="badge">13_main_weapon</span></label>
      <select id="partSelect">
        <option value="13_main_weapon">13. 주무기 (검)</option>
        <option value="12_wings_cape">12. 날개/망토</option>
        <option value="10_top_dress">10. 상의</option>
        <option value="04_base_body">04. 기본 체형 (소체)</option>
      </select>
    </div>

    <div class="form-group">
      <label>회전각 (Rotation): <span id="lblRot" class="val-text">-20°</span></label>
      <input type="range" id="rngRot" min="-180" max="180" value="-20">
    </div>

    <div class="form-group">
      <label>피벗 X (0.0 ~ 1.0): <span id="lblPivotX" class="val-text">0.5</span></label>
      <input type="range" id="rngPivotX" min="0" max="1" step="0.05" value="0.5">
    </div>

    <div class="form-group">
      <label>피벗 Y (0.0 ~ 1.0): <span id="lblPivotY" class="val-text">0.85</span></label>
      <input type="range" id="rngPivotY" min="0" max="1" step="0.05" value="0.85">
    </div>

    <div class="form-group">
      <label>결합 앵커 X: <span id="lblAnchorX" class="val-text">230</span></label>
      <input type="range" id="rngAnchorX" min="50" max="550" value="230">
    </div>

    <div class="form-group">
      <label>결합 앵커 Y: <span id="lblAnchorY" class="val-text">320</span></label>
      <input type="range" id="rngAnchorY" min="50" max="550" value="320">
    </div>

    <div class="form-group">
      <label>좌우 반전 (Flip X): <span id="lblFlip" class="val-text">false</span></label>
      <input type="checkbox" id="chkFlip" style="width: 20px; height: 20px; cursor: pointer;">
    </div>

    <button id="btnExport" class="btn-primary">
      보정된 JSON 설정 클립보드 복사
    </button>
    <div id="statusBox" class="status-box">클립보드에 JSON이 복사되었습니다!</div>
  </div>

  <script src="js/part_rigging.js"></script>
  <script>
    // 1~2. PartNormalizer / PartRiggingSystem 엔진은 js/part_rigging.js 공용 모듈에서 로드

    /**
     * ========================================================================
     * 3. 데모 데이터 및 그래픽 목업(Mock) 생성
     * ========================================================================
     */
    const mockConfig = {
      characterId: "CH_TEST_DEMO",
      parts: [
        { id: "12_wings_cape", name: "날개/망토", zIndex: 5, anchor: { x: 300, y: 260 }, pivot: { x: 0.5, y: 0.3 }, scale: { x: 1, y: 1 }, rotation: 0, flipX: false, targetBounds: { width: 220, height: 120 } },
        { id: "04_base_body", name: "소체", zIndex: 10, anchor: { x: 300, y: 300 }, pivot: { x: 0.5, y: 0.5 }, scale: { x: 1, y: 1 }, rotation: 0, flipX: false, targetBounds: { width: 140, height: 260 } },
        { id: "10_top_dress", name: "상의", zIndex: 20, anchor: { x: 300, y: 280 }, pivot: { x: 0.5, y: 0.2 }, scale: { x: 1, y: 1 }, rotation: 0, flipX: false, targetBounds: { width: 110, height: 90 } },
        { id: "13_main_weapon", name: "주무기 (검)", zIndex: 30, anchor: { x: 230, y: 320 }, pivot: { x: 0.5, y: 0.85 }, scale: { x: 1, y: 1 }, rotation: -20, flipX: false, targetBounds: { width: 40, height: 160 } }
      ]
    };

    // 파츠 형태를 직관적으로 확인할 수 있는 더미 그래픽 생성
    function createMockAsset(type, w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');

      if (type === 'body') {
        // 소체: 머리 + 몸통
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(w / 2, h * 0.25, 45, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.roundRect ? ctx.roundRect(w * 0.2, h * 0.45, w * 0.6, h * 0.5, 12) : ctx.rect(w * 0.2, h * 0.45, w * 0.6, h * 0.5);
        ctx.fill();
      } else if (type === 'wings') {
        // 날개: 좌우 날개 형태
        ctx.fillStyle = '#818cf8';
        ctx.beginPath();
        ctx.ellipse(w * 0.25, h * 0.5, w * 0.25, h * 0.4, -0.2, 0, Math.PI * 2);
        ctx.ellipse(w * 0.75, h * 0.5, w * 0.25, h * 0.4, 0.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === 'dress') {
        // 상의: 핑크 아머
        ctx.fillStyle = '#ec4899';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(5, 5, w - 10, h - 10, 8) : ctx.rect(5, 5, w - 10, h - 10);
        ctx.fill();
      } else if (type === 'weapon') {
        // 검: 손잡이 + 칼날
        ctx.fillStyle = '#10b981';
        ctx.fillRect(w * 0.35, 10, w * 0.3, h * 0.7); // 칼날
        ctx.fillStyle = '#065f46';
        ctx.fillRect(w * 0.1, h * 0.7, w * 0.8, 10); // 코등이
        ctx.fillStyle = '#78350f';
        ctx.fillRect(w * 0.4, h * 0.7 + 10, w * 0.2, h * 0.2); // 손잡이
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, w, h);
      return c;
    }

    /**
     * ========================================================================
     * 4. 시스템 구동 및 이벤트 바인딩
     * ========================================================================
     */
    const canvas = document.getElementById('viewCanvas');
    const system = new PartRiggingSystem(canvas, mockConfig);

    // 각 파츠 더미 그래픽 등록
    system.imageMap.set("04_base_body", createMockAsset('body', 140, 260));
    system.imageMap.set("12_wings_cape", createMockAsset('wings', 220, 120));
    system.imageMap.set("10_top_dress", createMockAsset('dress', 110, 90));
    system.imageMap.set("13_main_weapon", createMockAsset('weapon', 40, 160));

    system.selectedPartId = "13_main_weapon";
    system.render();

    // DOM 컨트롤 바인딩
    const sel = document.getElementById('partSelect');
    const rot = document.getElementById('rngRot');
    const pivX = document.getElementById('rngPivotX');
    const pivY = document.getElementById('rngPivotY');
    const ancX = document.getElementById('rngAnchorX');
    const ancY = document.getElementById('rngAnchorY');
    const chkFlip = document.getElementById('chkFlip');
    const statusBox = document.getElementById('statusBox');

    function syncControls() {
      const part = mockConfig.parts.find(p => p.id === sel.value);
      if (!part) return;

      system.selectedPartId = part.id;
      document.getElementById('lblPart').innerText = part.id;
      
      rot.value = part.rotation;
      pivX.value = part.pivot.x;
      pivY.value = part.pivot.y;
      ancX.value = part.anchor.x;
      ancY.value = part.anchor.y;
      chkFlip.checked = !!part.flipX;

      document.getElementById('lblRot').innerText = part.rotation + '°';
      document.getElementById('lblPivotX').innerText = part.pivot.x;
      document.getElementById('lblPivotY').innerText = part.pivot.y;
      document.getElementById('lblAnchorX').innerText = part.anchor.x;
      document.getElementById('lblAnchorY').innerText = part.anchor.y;
      document.getElementById('lblFlip').innerText = String(!!part.flipX);

      system.render();
    }

    sel.onchange = syncControls;

    rot.oninput = (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('lblRot').innerText = val + '°';
      system.updatePartTransform(sel.value, { rotation: val });
    };

    pivX.oninput = (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('lblPivotX').innerText = val;
      system.updatePartTransform(sel.value, { pivot: { x: val } });
    };

    pivY.oninput = (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('lblPivotY').innerText = val;
      system.updatePartTransform(sel.value, { pivot: { y: val } });
    };

    ancX.oninput = (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('lblAnchorX').innerText = val;
      system.updatePartTransform(sel.value, { anchor: { x: val } });
    };

    ancY.oninput = (e) => {
      const val = parseFloat(e.target.value);
      document.getElementById('lblAnchorY').innerText = val;
      system.updatePartTransform(sel.value, { anchor: { y: val } });
    };

    chkFlip.onchange = (e) => {
      document.getElementById('lblFlip').innerText = String(e.target.checked);
      system.updatePartTransform(sel.value, { flipX: e.target.checked });
    };

    document.getElementById('btnExport').onclick = () => {
      navigator.clipboard.writeText(system.exportConfig()).then(() => {
        statusBox.style.display = 'block';
        setTimeout(() => { statusBox.style.display = 'none'; }, 2500);
      });
    };

    syncControls();
  </script>
</body>
</html>
